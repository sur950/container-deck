name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    # Override with the MACOS_RUNNER repository variable when a newer image is out.
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build --arch arm64

      - name: Test
        timeout-minutes: 20
        run: swift test --parallel

      - name: Check scripts and Info.plist
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          # These run on users' Macs with the system bash 3.2, so check them with it.
          for f in contrib/docker/docker; do /bin/bash -n "$f"; done
          plutil -lint scripts/Info.plist packaging/ContainerDeck.entitlements
