<!-- Hand-made diagram for docs/ARCHITECTURE.md. scripts/build_docs.py inlines it in place of the
     matching mermaid block. The style block is only for viewing this file on its own: the site
     drops it and colors the classes from website/assets/css/docs.css, so Light and Dark follow the theme. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 476" width="380" height="476" role="img" aria-labelledby="dg-update-title dg-update-desc">
  <title id="dg-update-title">How an update is installed</title>
  <desc id="dg-update-desc">The app checks GitHub Releases, downloads the disk image, checks its SHA-256 checksum and Ed25519 signature, confirms the bundle id and signing certificate match the running app, swaps the app in place and relaunches. If any step fails, the old version stays.</desc>
  <style>
  .dg-layer{fill:#F7F6F3;stroke:rgba(17,18,21,.15)}
  .dg-box,.dg-pill{fill:#FFFFFF;stroke:rgba(17,18,21,.15)}
  .dg-box-accent{fill:#FBEFF1;stroke:#B3122E}
  .dg-box-ext{fill:#FFFFFF;stroke:rgba(17,18,21,.22);stroke-dasharray:4 3}
  .dg-group{fill:none;stroke:rgba(17,18,21,.15);stroke-dasharray:4 3}
  .dg-chip,.dg-lane{fill:#EFEDE8}
  .dg-line{fill:none;stroke:#8A8D95;stroke-width:1.4}
  .dg-line-accent{fill:none;stroke:#B3122E;stroke-width:1.6}
  .dg-head{fill:#8A8D95}.dg-head-accent{fill:#B3122E}
  text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;fill:#4D5058}
  .dg-title,.dg-layer-title,.dg-lane-text{fill:#111215;font-size:13px;font-weight:600}
  .dg-layer-title{font-size:12px;font-weight:650;letter-spacing:.02em}
  .dg-sub,.dg-chip-text{font-size:11.5px}
  .dg-chip-text{font-weight:500}
  .dg-code,.dg-tag{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;font-size:10.5px;fill:#5F626A}
  .dg-group-title,.dg-label{font-size:11px;font-weight:600;fill:#5F626A}
  .dg-label-accent{font-size:11px;font-weight:600;fill:#B3122E}
  .dg-title-accent{fill:#B3122E}
  </style>

  <!-- Start -->
  <rect class="dg-pill" x="16" y="16" width="240" height="46" rx="23"/>
  <text class="dg-title" x="136" y="35" text-anchor="middle">Check GitHub Releases</text>
  <text class="dg-sub" x="136" y="50" text-anchor="middle">after launch, then on a timer</text>
  <path class="dg-line" d="M136 62 L136 78"/>
  <path class="dg-head" d="M136 84 L132 77 L140 77 Z"/>
  <rect class="dg-box" x="16" y="84" width="240" height="46" rx="10"/>
  <text class="dg-title" x="136" y="104" text-anchor="middle">Download the disk image</text>
  <text class="dg-sub" x="136" y="119" text-anchor="middle">the release .dmg</text>
  <path class="dg-line" d="M136 130 L136 146"/>
  <path class="dg-head" d="M136 152 L132 145 L140 145 Z"/>
  <rect class="dg-box" x="16" y="152" width="240" height="46" rx="10"/>
  <text class="dg-title" x="136" y="172" text-anchor="middle">SHA-256 checksum</text>
  <text class="dg-sub" x="136" y="187" text-anchor="middle">against the .sha256 asset</text>
  <path class="dg-line" d="M136 198 L136 214"/>
  <path class="dg-head" d="M136 220 L132 213 L140 213 Z"/>
  <rect class="dg-box" x="16" y="220" width="240" height="46" rx="10"/>
  <text class="dg-title" x="136" y="240" text-anchor="middle">Ed25519 signature</text>
  <text class="dg-sub" x="136" y="255" text-anchor="middle">against the .sig asset</text>
  <path class="dg-line" d="M136 266 L136 282"/>
  <path class="dg-head" d="M136 288 L132 281 L140 281 Z"/>
  <rect class="dg-box" x="16" y="288" width="240" height="46" rx="10"/>
  <text class="dg-title" x="136" y="308" text-anchor="middle">App signature and identity</text>
  <text class="dg-sub" x="136" y="323" text-anchor="middle">bundle id and certificate match</text>
  <path class="dg-line" d="M136 334 L136 350"/>
  <path class="dg-head" d="M136 356 L132 349 L140 349 Z"/>
  <rect class="dg-box-accent" x="16" y="356" width="240" height="46" rx="10"/>
  <text class="dg-title-accent dg-title" x="136" y="376" text-anchor="middle">Swap the app in place</text>
  <text class="dg-sub" x="136" y="391" text-anchor="middle">old copy kept until the new one runs</text>

  <!-- Lane -->
  <rect class="dg-lane" x="318" y="84" width="46" height="318" rx="12"/>
  <text class="dg-lane-text" x="345.5" y="243" text-anchor="middle" transform="rotate(-90 345.5 243)">Old version stays</text>
  <path class="dg-line" d="M256 107 L312 107"/>
  <path class="dg-head" d="M318 107 L311 111 L311 103 Z"/>
  <text class="dg-label" x="287" y="101" text-anchor="middle">fails</text>
  <path class="dg-line" d="M256 175 L312 175"/>
  <path class="dg-head" d="M318 175 L311 179 L311 171 Z"/>
  <text class="dg-label" x="287" y="169" text-anchor="middle">fails</text>
  <path class="dg-line" d="M256 243 L312 243"/>
  <path class="dg-head" d="M318 243 L311 247 L311 239 Z"/>
  <text class="dg-label" x="287" y="237" text-anchor="middle">fails</text>
  <path class="dg-line" d="M256 311 L312 311"/>
  <path class="dg-head" d="M318 311 L311 315 L311 307 Z"/>
  <text class="dg-label" x="287" y="305" text-anchor="middle">fails</text>
  <path class="dg-line" d="M256 379 L312 379"/>
  <path class="dg-head" d="M318 379 L311 383 L311 375 Z"/>
  <text class="dg-label" x="287" y="373" text-anchor="middle">fails</text>

  <!-- End -->
  <path class="dg-line" d="M136 402 L136 418"/>
  <path class="dg-head" d="M136 424 L132 417 L140 417 Z"/>
  <rect class="dg-pill" x="16" y="424" width="240" height="36" rx="18"/>
  <text class="dg-title" x="136" y="446.5" text-anchor="middle">Relaunch the new version</text>
</svg>
