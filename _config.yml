# GitHub Pages site for Container Deck.
# README.md is the home page (jekyll-readme-index). Pages are served from the
# repository root on main at https://sur950.github.io/container-deck/.
# The layout and the styles live in _layouts/default.html and assets/site/.

title: Container Deck
tagline: The native Mac app for Apple's container platform
description: >-
  Run, build and manage Linux containers on Apple silicon with Apple's container
  platform. Compose, Kubernetes, local AI, MCP servers and HTTPS domains in one
  fast SwiftUI app. Free, no account, an 8 MB download.
url: https://sur950.github.io
baseurl: /container-deck
repository: sur950/container-deck
author: Suresh Konakanchi
author_url: https://suresh-konakanchi.in
social_image: /docs/screenshots/dashboard-light.png
theme_color_light: "#F4F3F0"
theme_color_dark: "#0E0F12"
lang: en

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

# The first five are always on at GitHub Pages and listed so a local `jekyll build` behaves
# the same. jekyll-sitemap writes /sitemap.xml and a robots.txt that points to it.
plugins:
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-default-layout
  - jekyll-titles-from-headings
  - jekyll-sitemap

readme_index:
  remove_originals: true

optional_front_matter:
  remove_originals: true

relative_links:
  enabled: true
  collections: false

titles_from_headings:
  enabled: true
  strip_title: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Sources
  - Tests
  - scripts
  - packaging
  - build
  - .build
  - .swiftpm
  - Package.swift
  - Package.resolved
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - "*.xcodeproj"
  - "*.xcworkspace"
  - "*.dmg"
  - "*.zip"
